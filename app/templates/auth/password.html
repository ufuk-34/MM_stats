{% extends "base.html" %}
{% block title %}Şifre Değiştir{% endblock %}
{% block content %}
<div class="page-head"><h1>Şifre Değiştir</h1></div>
<form method="post" class="card form-narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Mevcut şifre<input type="password" name="current_password" required autocomplete="current-password"></label>
  <label>Yeni şifre (en az 8 karakter)<input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
  <label>Yeni şifre (tekrar)<input type="password" name="new_password2" required minlength="8" autocomplete="new-password"></label>
  <div class="form-actions"><button class="btn btn-primary" type="submit">Kaydet</button></div>
</form>
{% endblock %}
