{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card error-card">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Ana sayfaya dön</a>
</div>
{% endblock %}
{% block public %}
<div class="login-wrap">
  <div class="card login-card">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Giriş sayfası</a>
  </div>
</div>
{% endblock %}
