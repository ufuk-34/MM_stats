# Windows kurulum dosyasını (DestekKayit-Kurulum.exe) üretir.
# Çıktılar: Actions -> ilgili çalıştırma -> "Artifacts" bölümünden indirilir.
# "v1.0.0" gibi bir etiket (tag) gönderilirse ayrıca GitHub Release oluşturulur.
name: Windows Kurulum Dosyası

on:
  push:
    branches: [main, master, ccr-0412b46f-zj45ki]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Testleri çalıştır
        run: python -m pytest -q

      - name: .exe oluştur (PyInstaller)
        run: python -m PyInstaller packaging/DestekKayit.spec --noconfirm

      - name: .exe duman testi
        shell: pwsh
        run: |
          $env:DESTEK_DATA_DIR = "$env:RUNNER_TEMP\destek-test"
          $p = Start-Process -FilePath "dist\DestekKayit\DestekKayit.exe" -ArgumentList "--no-browser","--port","8765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/kurulum" -UseBasicParsing
              if ($r.StatusCode -eq 200 -and $r.Content -match "İlk Kurulum") { $ok = $true }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "Program başlatılamadı" }
          if (-not (Test-Path "$env:DESTEK_DATA_DIR\destek.db")) { throw "Veritabanı oluşturulmadı" }
          Write-Host "Duman testi başarılı"

      - name: Kurulum dosyası oluştur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız" }

      - name: Taşınabilir sürüm (zip)
        shell: pwsh
        run: |
          Copy-Item KURULUM.md dist\DestekKayit\KULLANIM_KILAVUZU.txt
          Compress-Archive -Path dist\DestekKayit -DestinationPath dist\DestekKayit-Tasinabilir.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DestekKayit-Windows
          path: |
            dist/DestekKayit-Kurulum.exe
            dist/DestekKayit-Tasinabilir.zip
            KURULUM.md
          retention-days: 90

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DestekKayit-Kurulum.exe
            dist/DestekKayit-Tasinabilir.zip
